<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการคำร้อง</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-light">
    <div class="container py-4">
        <h2 class="text-center mb-4">ระบบยื่นและติดตามคำร้อง</h2>
        
        <ul class="nav nav-tabs mb-4" id="myTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="submit-tab" data-bs-toggle="tab" data-bs-target="#submit" type="button" role="tab">ยื่นคำร้องใหม่</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="list-tab" data-bs-toggle="tab" data-bs-target="#list" type="button" role="tab" onclick="loadRequests()">รายการคำร้อง (ประชาชน)</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="admin-tab" data-bs-toggle="tab" data-bs-target="#admin" type="button" role="tab" onclick="loadAdminRequests()">ส่วนเจ้าหน้าที่</button>
            </li>
        </ul>

        <div class="tab-content" id="myTabContent">
            <!-- ฟอร์มยื่นคำร้อง -->
            <div class="tab-pane fade show active" id="submit" role="tabpanel">
                <div class="card shadow-sm p-4">
                    <form id="requestForm" onsubmit="submitForm(event)">
                        <div class="mb-3">
                            <label class="form-label">ชื่อ-นามสกุล</label>
                            <input type="text" class="form-control" id="reqName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">เบอร์โทรศัพท์</label>
                            <input type="text" class="form-control" id="reqPhone" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">ที่อยู่</label>
                            <textarea class="form-control" id="reqAddress" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">รหัส PIN (สำหรับแก้ไขข้อมูล 4-6 หลัก)</label>
                            <input type="password" class="form-control" id="pin" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">แนบไฟล์เอกสาร (สูงสุด 4 ไฟล์)</label>
                            <input type="file" class="form-control mb-2" id="file1">
                            <input type="file" class="form-control mb-2" id="file2">
                            <input type="file" class="form-control mb-2" id="file3">
                            <input type="file" class="form-control" id="file4">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">ส่งคำร้อง</button>
                    </form>
                </div>
            </div>

            <!-- รายการคำร้อง (ประชาชน) -->
            <div class="tab-pane fade" id="list" role="tabpanel">
                <div class="table-responsive bg-white shadow-sm p-3 rounded">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>รหัสคำร้อง</th>
                                <th>วันที่</th>
                                <th>ชื่อผู้ยื่น</th>
                                <th>สถานะ</th>
                                <th>การจัดการ</th>
                            </tr>
                        </thead>
                        <tbody id="userTableBody"></tbody>
                    </table>
                </div>
            </div>

            <!-- ส่วนเจ้าหน้าที่ -->
            <div class="tab-pane fade" id="admin" role="tabpanel">
                <div class="table-responsive bg-white shadow-sm p-3 rounded">
                    <table class="table table-bordered">
                        <thead class="table-dark">
                            <tr>
                                <th>รหัสคำร้อง</th>
                                <th>วันที่</th>
                                <th>ชื่อผู้ยื่น</th>
                                <th>สถานะ</th>
                                <th>การจัดการเจ้าหน้าที่</th>
                            </tr>
                        </thead>
                        <tbody id="adminTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal แก้ไขไฟล์ -->
    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">อัปเดตไฟล์เอกสาร</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="editReqId">
                    <input type="hidden" id="editIsAdmin">
                    <div class="mb-3" id="pinSection">
                        <label>รหัส PIN ยืนยันการแก้ไข</label>
                        <input type="password" class="form-control" id="editPin">
                    </div>
                    <div class="mb-3">
                        <label>อัปโหลดไฟล์ใหม่ (เลือกเฉพาะที่ต้องการเปลี่ยน)</label>
                        <input type="file" class="form-control mb-2" id="editFile1">
                        <input type="file" class="form-control mb-2" id="editFile2">
                        <input type="file" class="form-control mb-2" id="editFile3">
                        <input type="file" class="form-control" id="editFile4">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">ยกเลิก</button>
                    <button type="button" class="btn btn-success" onclick="saveFiles()">บันทึกเอกสาร</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal จัดการสถานะ (แอดมิน) -->
    <div class="modal fade" id="statusModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">อัปเดตสถานะ</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="statusReqId">
                    <div class="mb-3">
                        <label>สถานะ</label>
                        <select class="form-select" id="newStatus">
                            <option value="รอตรวจสอบ">รอตรวจสอบ</option>
                            <option value="กำลังดำเนินการ">กำลังดำเนินการ</option>
                            <option value="อนุมัติแล้ว">อนุมัติแล้ว</option>
                            <option value="ถูกปฏิเสธ">ถูกปฏิเสธ</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label>หมายเหตุ</label>
                        <textarea class="form-control" id="newRemark"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">ยกเลิก</button>
                    <button type="button" class="btn btn-primary" onclick="saveStatus()">บันทึกสถานะ</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // ลิงก์ API ล่าสุดของคุณ
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxAHxOFVPACXSl_SgIXLiwz7q-tZRgWEZZ9nl0C-ZTqgWDOVO-IiuPQzP-aVdbWU2AB/exec";
        const IMGBB_API_KEY = "YOUR_IMGBB_API_KEY"; // ⚠️ อย่าลืมใส่ API Key ของ ImgBB ตรงนี้

        async function uploadToImgBB(fileInputId) {
            const file = document.getElementById(fileInputId).files[0];
            if (!file) return "";
            
            const formData = new FormData();
            formData.append("image", file);
            
            try {
                const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                return data.data.url;
            } catch (error) {
                console.error("ImgBB Upload Error:", error);
                return "";
            }
        }

        async function submitForm(e) {
            e.preventDefault();
            Swal.fire({ title: 'กำลังส่งข้อมูล...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });
            
            try {
                let f1 = await uploadToImgBB('file1');
                let f2 = await uploadToImgBB('file2');
                let f3 = await uploadToImgBB('file3');
                let f4 = await uploadToImgBB('file4');

                const payload = {
                    action: 'submitRequest',
                    reqName: document.getElementById('reqName').value,
                    reqPhone: document.getElementById('reqPhone').value,
                    reqAddress: document.getElementById('reqAddress').value,
                    pin: document.getElementById('pin').value,
                    file1: f1, file2: f2, file3: f3, file4: f4
                };

                const response = await fetch(GAS_API_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                
                const result = await response.json();
                if (result.success) {
                    Swal.fire('สำเร็จ', 'ยื่นคำร้องเรียบร้อยแล้ว รหัส: ' + result.reqId, 'success');
                    document.getElementById('requestForm').reset();
                } else {
                    Swal.fire('ผิดพลาด', result.message, 'error');
                }
            } catch (error) {
                Swal.fire('ผิดพลาด', error.message, 'error');
            }
        }

        async function loadRequests() {
            Swal.fire({ title: 'กำลังโหลดข้อมูล...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });
            try {
                const response = await fetch(GAS_API_URL, { method: 'POST', body: JSON.stringify({ action: 'getAllRequests' }) });
                const result = await response.json();
                if (result.success) {
                    let html = '';
                    result.data.forEach(req => {
                        html += `<tr>
                            <td>${req['รหัสคำร้อง (ID)']}</td>
                            <td>${new Date(req['วันที่ (Timestamp)']).toLocaleDateString('th-TH')}</td>
                            <td>${req['ชื่อ-นามสกุล']}</td>
                            <td><span class="badge bg-info">${req['สถานะ']}</span></td>
                            <td>
                                <button class="btn btn-sm btn-outline-warning" onclick="openEditModal('${req['รหัสคำร้อง (ID)']}', false)">✏️ แก้ไข</button>
                            </td>
                        </tr>`;
                    });
                    document.getElementById('userTableBody').innerHTML = html;
                    Swal.close();
                }
            } catch (error) {
                Swal.fire('ผิดพลาด', 'ไม่สามารถโหลดข้อมูลได้', 'error');
            }
        }

        async function loadAdminRequests() {
            Swal.fire({ title: 'กำลังโหลดข้อมูล...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });
            try {
                const response = await fetch(GAS_API_URL, { method: 'POST', body: JSON.stringify({ action: 'getAllRequests' }) });
                const result = await response.json();
                if (result.success) {
                    let html = '';
                    result.data.forEach(req => {
                        html += `<tr>
                            <td>${req['รหัสคำร้อง (ID)']}</td>
                            <td>${new Date(req['วันที่ (Timestamp)']).toLocaleDateString('th-TH')}</td>
                            <td>${req['ชื่อ-นามสกุล']}</td>
                            <td><span class="badge bg-primary">${req['สถานะ']}</span><br><small>${req['หมายเหตุเจ้าหน้าที่'] || '-'}</small></td>
                            <td>
                                <button class="btn btn-sm btn-warning mb-1" onclick="openEditModal('${req['รหัสคำร้อง (ID)']}', true)">✏️ แก้ไขเอกสาร</button>
                                <button class="btn btn-sm btn-info mb-1" onclick="openStatusModal('${req['รหัสคำร้อง (ID)']}', '${req['สถานะ']}', '${req['หมายเหตุเจ้าหน้าที่']}')">📝 สถานะ</button>
                            </td>
                        </tr>`;
                    });
                    document.getElementById('adminTableBody').innerHTML = html;
                    Swal.close();
                }
            } catch (error) {
                Swal.fire('ผิดพลาด', 'ไม่สามารถโหลดข้อมูลได้', 'error');
            }
        }

        function openEditModal(reqId, isAdmin) {
            document.getElementById('editReqId').value = reqId;
            document.getElementById('editIsAdmin').value = isAdmin;
            
            if (isAdmin) {
                document.getElementById('pinSection').style.display = 'none';
                document.getElementById('editPin').value = 'admin'; // ใส่ค่าหลอกเพื่อผ่าน validate html
            } else {
                document.getElementById('pinSection').style.display = 'block';
                document.getElementById('editPin').value = '';
            }
            
            new bootstrap.Modal(document.getElementById('editModal')).show();
        }

        async function saveFiles() {
            const reqId = document.getElementById('editReqId').value;
            const isAdmin = document.getElementById('editIsAdmin').value === 'true';
            const pin = document.getElementById('editPin').value;

            if (!isAdmin && !pin) return Swal.fire('แจ้งเตือน', 'กรุณากรอกรหัส PIN', 'warning');

            Swal.fire({ title: 'กำลังอัปเดตไฟล์...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });
            
            try {
                let f1 = await uploadToImgBB('editFile1');
                let f2 = await uploadToImgBB('editFile2');
                let f3 = await uploadToImgBB('editFile3');
                let f4 = await uploadToImgBB('editFile4');

                const payload = {
                    action: 'updateRequest',
                    reqId: reqId,
                    pin: pin,
                    isAdminUpdate: isAdmin,
                    file1: f1, file2: f2, file3: f3, file4: f4
                };

                const response = await fetch(GAS_API_URL, { method: 'POST', body: JSON.stringify(payload) });
                const result = await response.json();
                
                if (result.success) {
                    Swal.fire('สำเร็จ', 'อัปเดตไฟล์เรียบร้อย', 'success');
                    bootstrap.Modal.getInstance(document.getElementById('editModal')).hide();
                    isAdmin ? loadAdminRequests() : loadRequests();
                } else {
                    Swal.fire('ผิดพลาด', result.message, 'error');
                }
            } catch (error) {
                Swal.fire('ผิดพลาด', error.message, 'error');
            }
        }

        function openStatusModal(reqId, currentStatus, currentRemark) {
            document.getElementById('statusReqId').value = reqId;
            document.getElementById('newStatus').value = currentStatus;
            document.getElementById('newRemark').value = currentRemark === 'undefined' ? '' : currentRemark;
            new bootstrap.Modal(document.getElementById('statusModal')).show();
        }

        async function saveStatus() {
            const payload = {
                action: 'adminUpdateStatus',
                reqId: document.getElementById('statusReqId').value,
                status: document.getElementById('newStatus').value,
                remark: document.getElementById('newRemark').value
            };

            Swal.fire({ title: 'กำลังอัปเดตสถานะ...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });
            
            try {
                const response = await fetch(GAS_API_URL, { method: 'POST', body: JSON.stringify(payload) });
                const result = await response.json();
                if (result.success) {
                    Swal.fire('สำเร็จ', 'อัปเดตสถานะเรียบร้อย', 'success');
                    bootstrap.Modal.getInstance(document.getElementById('statusModal')).hide();
                    loadAdminRequests();
                }
            } catch (error) {
                Swal.fire('ผิดพลาด', error.message, 'error');
            }
        }
    </script>
</body>
</html>
